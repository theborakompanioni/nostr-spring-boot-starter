
services:
  # https://github.com/theborakompanioni/demente
  relay:
    image: ghcr.io/theborakompanioni/demented:0.2.0@sha256:c8e7b0f2dc1c8c8f7d5708d85a28909632a4161d94244a3806ed5b2dd177fe7a
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7000:8080"
      - "9001:9001"
    command: >
      --spring.profiles.active=development
      --spring.datasource.url=jdbc:postgresql://postgres:5432/regtest_nostr_relay0
      --spring.datasource.username=regtest_nostr_relay0
      --spring.datasource.password=regtest_nostr_relay0
      --spring.datasource.driver-class-name=org.postgresql.Driver
      --spring.datasource.hikari.pool-name=PostgresPool
      --spring.datasource.hikari.maximum-pool-size=10
      --spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
      --spring.http.log-request-details=false
      --logging.level.web=INFO

  postgres:
    image: postgres:18.1-alpine3.21@sha256:44d837eb4c2ed263474a95f0cc24745413c50924df60dd73ed6c4c3e36b84259
    restart: no
    labels:
      org.springframework.boot.ignore: true
    volumes:
      - nsbs-demente-postgres-data:/postgresql_data
      - ./../pg/data/pg/init:/docker-entrypoint-initdb.d/
    environment:
      POSTGRES_ADDITIONAL_DATABASES: regtest_nostr_relay0
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: /postgresql_data
    ports:
      - "15432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --dbname=postgres --username=postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nsbs-demente-postgres-data: