services:
  pgvector:
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:1963bc48febf543433baa1ce3edcc6cc08154de722e22495f86681cc9a849026
    restart: no
    labels:
      org.springframework.boot.ignore: true
    volumes:
      - nsbs-pgvector-data:/postgresql_data
      - ./data/pgvector/init:/docker-entrypoint-initdb.d/
    environment:
      #POSTGRES_ADDITIONAL_DATABASES: regtest <- does not work
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGDATA: /postgresql_data
    ports:
      - "${POSTGRES_PORT:-16432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    profiles: [ "development" ]
    image: dpage/pgadmin4:9.15.0@sha256:cefc4cc6b7d9d71a9e81e76fb9d7e14038ab5661b539a190eea1b63fa612589a
    restart: no
    # don't wait for health checks, ui is for humans and should not block the application from starting
    healthcheck:
      disable: true
      test: [ "NONE" ]
    volumes:
      - nsbs-pgvector-pgadmin-data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgvector@example.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgvector}
      PGADMIN_CONFIG_SERVER_MODE: 'False' # Single-user environment with automatic login
    ports:
      - "${PGADMIN_PORT:-16532}:80"
    depends_on:
      pgvector:
        condition: service_healthy

volumes:
  nsbs-pgvector-data:
  nsbs-pgvector-pgadmin-data:
