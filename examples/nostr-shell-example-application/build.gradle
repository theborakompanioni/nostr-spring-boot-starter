apply plugin: 'org.springframework.boot'

description = 'nostr shell example application package'

dependencyManagement {
    imports {
        mavenBom "org.springframework.shell:spring-shell-dependencies:${rootProject.ext.springShellVersion}"
    }
}

bootRun {
    args = [] // overwrite from global gradle build
    standardInput = System.in // needed for interactive spring-shell mode
}

dependencies {
    implementation project(':nostr:nostr-core')
    implementation project(':nostr:nostr-nip19')

    implementation "fr.acinq.bitcoin:bitcoin-kmp-jvm:${rootProject.ext.acinqBitcoinKmpVersion}"
    implementation "fr.acinq.secp256k1:secp256k1-kmp-jni-jvm:${rootProject.ext.acinqSecp256k1KmpVersion}"

    implementation "tools.jackson.jr:jackson-jr-all:${rootProject.ext.jacksonJrVersion}"

    implementation 'io.projectreactor:reactor-core'

    // for importing "DurationStyle" class
    implementation 'org.springframework.boot:spring-boot'

    implementation 'org.springframework.shell:spring-shell-starter'
    testImplementation 'org.springframework.shell:spring-shell-starter-test'
}
