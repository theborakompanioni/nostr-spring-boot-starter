
services:
  ollama:
    image: ollama/ollama:0.32.5@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
    restart: no
    ports:
      - "19434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      # https://github.com/ollama/ollama/blob/0fe487e7325cd72b8b06e758c2a03842c557dbda/envconfig/config.go#L239
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: "ollama --version && ollama ps || exit 1"
      start_period: 30s
      start_interval: 5s
      interval: 30s
      retries: 5
      timeout: 5s

  open-webui:
    profiles: ["open-webui"]
    image: ghcr.io/open-webui/open-webui:0.11.0-slim@sha256:88da9f0e08b8ada8e40bc6d6291494e2c6775a62d24b67b0cefb74ffee4ce621
    restart: no
    depends_on:
      ollama:
        condition: service_started # don't wait, ui is for humans and should not block the application from starting
    # don't wait for health checks, ui is for humans and should not block the application from starting
    healthcheck:
      disable: true
      test: ["CMD", "exit", "0"]
    ports:
      - "19480:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      # https://docs.openwebui.com/getting-started/env-configuration
      OLLAMA_BASE_URL: http://ollama:11434
      USER_AGENT: nostr-agentic
      WEBUI_NAME: nostr-agentic
      WEBUI_ADMIN_EMAIL: 'open-webui@example.org'
      WEBUI_ADMIN_PASSWORD: 'open-webui'
      ENABLE_SIGNUP: false
      ENABLE_PUBLIC_ACTIVE_USERS_COUNT: false
      # DO NOT TRACK
      OFFLINE_MODE: true
      HF_HUB_OFFLINE: 1
      SCARF_NO_ANALYTICS: true
      DO_NOT_TRACK: true
      ANONYMIZED_TELEMETRY: false

volumes:
  open-webui-data:
  ollama-data:
