spring.application.name: 'tbk-nostr-agentic-test'

logging.file.name: application-e2e.log
logging.level.org.tbk.nostr: TRACE

spring.docker.compose:
  file:
    - ./docker-compose.yml
    - ../../docker/regtest/demented/docker-compose.yml
  start:
    skip: never # default: if_running
    arguments:
      - '--force-recreate' # prevent "failed to set up container networking: network <id> not found"
  stop:
    command: DOWN # STOP is default, DOWN stops and removes containers and networks
    arguments:
      - '--remove-orphans'
      # - '--volumes' dont remove volumes, keep the downloaded models
  skip.in-tests: false
  profiles.active:
    - 'test' # override the default profile

org.tbk.nostr.example.agentic:
  client:
    relay-uri: 'ws://localhost:7000'

spring.ai:
  ollama:
    init:
      pull-model-strategy: when-missing
    # https://docs.spring.io/spring-ai/reference/api/chat/prompt-engineering-patterns.html
    chat:
      think: false
      temperature: 0.01 # very deterministic output
      max-tokens: 5
      top-k: 1
      top-p: 1
