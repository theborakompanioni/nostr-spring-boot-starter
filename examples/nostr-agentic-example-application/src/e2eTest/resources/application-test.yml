spring.application.name: 'tbk-nostr-agentic-test'

logging.file.name: application-e2e.log
logging.level.org.tbk.nostr: TRACE

spring.docker.compose:
  file:
    - ./docker-compose.yml
    - ../../docker/regtest/pgvector/docker-compose.yml
    - ../../docker/regtest/demented/docker-compose.yml
  arguments[0]: --project-name=nostr-agentic-example-e2e
  arguments[1]: --progress=auto
  stop.command: DOWN # STOP is default, DOWN stops and removes containers and networks
  #stop.arguments[0]: --volumes
  #stop.arguments[1]: --remove-orphans
  skip.in-tests: false
  profiles.active:
    - 'test'

org.tbk.nostr.example.agentic:
  client:
    relay-uri: 'ws://localhost:7000'

spring.ai:
  ollama:
    init:
      pull-model-strategy: when-missing
    # https://docs.spring.io/spring-ai/reference/api/chat/prompt-engineering-patterns.html
    chat:
      think: false
      temperature: 0.01 # very deterministic output
      num-predict: 1
      top-k: 1
      top-p: 1
