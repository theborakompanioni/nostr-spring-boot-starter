plugins {
    id 'java'
}

description = 'nostr identity package'

dependencies {
    implementation project(':nostr:nostr-base')
    implementation project(':nostr:nostr-nip6')

    api "io.github.theborakompanioni:nostr-proto:${rootProject.ext.nostrProtoVersion}"
    implementation "io.github.theborakompanioni:nostr-proto-json:${rootProject.ext.nostrProtoVersion}"

    api "fr.acinq.bitcoin:bitcoin-kmp-jvm:${rootProject.ext.acinqBitcoinKmpVersion}"
    implementation "fr.acinq.secp256k1:secp256k1-kmp-jni-jvm:${rootProject.ext.acinqSecp256k1KmpVersion}"

    implementation "com.google.guava:guava:${rootProject.ext.guavaVersion}"
}
