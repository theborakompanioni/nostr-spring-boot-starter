plugins {
    id 'java'
}

description = 'nostr core package'

dependencies {
    api project(':nostr:nostr-base')
    api project(':nostr:nostr-identity')

    api "io.github.theborakompanioni:nostr-proto-json:${rootProject.ext.nostrProtoVersion}"

    implementation "fr.acinq.bitcoin:bitcoin-kmp-jvm:${rootProject.ext.acinqBitcoinKmpVersion}"
    implementation "fr.acinq.secp256k1:secp256k1-kmp-jni-jvm:${rootProject.ext.acinqSecp256k1KmpVersion}"

    implementation "com.google.guava:guava:${rootProject.ext.guavaVersion}"

    testImplementation "com.fasterxml.jackson.jr:jackson-jr-all:${rootProject.ext.jacksonJrVersion}"
}
